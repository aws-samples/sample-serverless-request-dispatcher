AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cold start benchmark stack for the Serverless Request Dispatcher sample.
  Deploys five variants of the same function from one JAR so they can be
  measured side by side. Deploy only in a non-production test account.

Parameters:
  Architecture:
    Type: String
    AllowedValues: [x86_64, arm64]
    Default: x86_64
  TracingMode:
    Type: String
    AllowedValues: [Active, PassThrough]
    Default: Active
    Description: Active matches the shipped sample (X-Ray tracing on)

Globals:
  Function:
    CodeUri: ../sample-product-service/target/sample-product-service.jar
    Runtime: java21
    MemorySize: 512
    Timeout: 30
    Architectures: [!Ref Architecture]
    Tracing: !Ref TracingMode
    Environment:
      Variables:
        PRODUCT_TABLE: !Ref ProductTable
        PRODUCT_IMAGES_BUCKET: !Ref ProductImagesBucket
        SDK_PRIMING: "false"
    Tags:
      Project: serverless-request-dispatcher-benchmark
      Environment: benchmark

Resources:
  ProductTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: "Benchmark table stays empty; encrypted at rest with the AWS owned key."
          - id: CKV_AWS_28
            comment: "Benchmark table stays empty and is deleted with the stack; no data to back up."
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Benchmark bucket is never written to and is deleted with the stack."
          - id: CKV_AWS_21
            comment: "Benchmark bucket is never written to; versioning would block stack deletion if objects existed."
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # (a) Dispatcher + Dagger, no AWS SDK clients
  MinimalFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "Benchmark-only function in a short-lived test stack; reserved concurrency would cap the SnapStart burst."
          - id: CKV_AWS_116
            comment: "Benchmark-only, invoked synchronously; failures are counted by the scripts, not retried."
          - id: CKV_AWS_117
            comment: "Calls only DynamoDB and S3 public endpoints with IAM auth and TLS; a VPC would change the measured cold start."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names and flags, no secrets; a CMK would add KMS work to the measured init."
    Properties:
      Handler: com.amazonaws.serverless.sample.benchmark.MinimalHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref MinimalLogGroup

  # (b) Same controller and SDK clients, wired by hand, switch dispatch
  PlainFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "Benchmark-only function in a short-lived test stack; reserved concurrency would cap the SnapStart burst."
          - id: CKV_AWS_116
            comment: "Benchmark-only, invoked synchronously; failures are counted by the scripts, not retried."
          - id: CKV_AWS_117
            comment: "Calls only DynamoDB and S3 public endpoints with IAM auth and TLS; a VPC would change the measured cold start."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names and flags, no secrets; a CMK would add KMS work to the measured init."
    Properties:
      Handler: com.amazonaws.serverless.sample.benchmark.PlainHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref PlainLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket

  # (c) The sample as shipped
  SampleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "Benchmark-only function in a short-lived test stack; reserved concurrency would cap the SnapStart burst."
          - id: CKV_AWS_116
            comment: "Benchmark-only, invoked synchronously; failures are counted by the scripts, not retried."
          - id: CKV_AWS_117
            comment: "Calls only DynamoDB and S3 public endpoints with IAM auth and TLS; a VPC would change the measured cold start."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names and flags, no secrets; a CMK would add KMS work to the measured init."
    Properties:
      Handler: com.amazonaws.serverless.sample.LambdaHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref SampleLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket
      Events:
        ListProducts:
          Type: Api
          Properties:
            Path: /api/products
            Method: GET

  # (d) The sample with SDK priming during init (on-demand)
  SamplePrimedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "Benchmark-only function in a short-lived test stack; reserved concurrency would cap the SnapStart burst."
          - id: CKV_AWS_116
            comment: "Benchmark-only, invoked synchronously; failures are counted by the scripts, not retried."
          - id: CKV_AWS_117
            comment: "Calls only DynamoDB and S3 public endpoints with IAM auth and TLS; a VPC would change the measured cold start."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names and flags, no secrets; a CMK would add KMS work to the measured init."
    Properties:
      Handler: com.amazonaws.serverless.sample.LambdaHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref SamplePrimedLogGroup
      Environment:
        Variables:
          SDK_PRIMING: "true"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket

  # (e) The sample with SnapStart; priming runs before the snapshot is taken
  SnapStartFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "Benchmark-only function in a short-lived test stack; reserved concurrency would cap the SnapStart burst."
          - id: CKV_AWS_116
            comment: "Benchmark-only, invoked synchronously; failures are counted by the scripts, not retried."
          - id: CKV_AWS_117
            comment: "Calls only DynamoDB and S3 public endpoints with IAM auth and TLS; a VPC would change the measured cold start."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names and flags, no secrets; a CMK would add KMS work to the measured init."
    Properties:
      Handler: com.amazonaws.serverless.sample.LambdaHandler::handleRequest
      LoggingConfig:
        LogGroup: !Ref SnapStartLogGroup
      Environment:
        Variables:
          SDK_PRIMING: "true"
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket
      Events:
        ListProducts:
          Type: Api
          Properties:
            Path: /api/products
            Method: GET
            RestApiId: !Ref SnapStartApi

  SnapStartApi:
    Type: AWS::Serverless::Api
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_120
            comment: "Caching would hide Lambda invocations from the load test that the benchmark measures."
          - id: CKV_AWS_73
            comment: "Lambda X-Ray tracing is set by the TracingMode parameter; API stage tracing is not part of the measurement."
          - id: CKV_AWS_76
            comment: "Short-lived load-test API; Lambda REPORT logs are the measurement source."
    Properties:
      StageName: Prod

  # Named log groups, created before the functions so SnapStart's publish-time init
  # cannot race CloudFormation. Logs expire after 14 days and are deleted with the
  # stack, so collect results before 'sam delete'.
  MinimalLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Benchmark log groups hold only Lambda platform and REPORT lines, no customer data; 14-day retention and deleted with the stack."
    Properties:
      LogGroupName: !Sub "/benchmarks/${AWS::StackName}/minimal"
      RetentionInDays: 14
  PlainLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Benchmark log groups hold only Lambda platform and REPORT lines, no customer data; 14-day retention and deleted with the stack."
    Properties:
      LogGroupName: !Sub "/benchmarks/${AWS::StackName}/plain"
      RetentionInDays: 14
  SampleLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Benchmark log groups hold only Lambda platform and REPORT lines, no customer data; 14-day retention and deleted with the stack."
    Properties:
      LogGroupName: !Sub "/benchmarks/${AWS::StackName}/sample"
      RetentionInDays: 14
  SamplePrimedLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Benchmark log groups hold only Lambda platform and REPORT lines, no customer data; 14-day retention and deleted with the stack."
    Properties:
      LogGroupName: !Sub "/benchmarks/${AWS::StackName}/primed"
      RetentionInDays: 14
  SnapStartLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "Benchmark log groups hold only Lambda platform and REPORT lines, no customer data; 14-day retention and deleted with the stack."
    Properties:
      LogGroupName: !Sub "/benchmarks/${AWS::StackName}/snapstart"
      RetentionInDays: 14

Outputs:
  MinimalFunctionName:
    Value: !Ref MinimalFunction
  PlainFunctionName:
    Value: !Ref PlainFunction
  SampleFunctionName:
    Value: !Ref SampleFunction
  SamplePrimedFunctionName:
    Value: !Ref SamplePrimedFunction
  SnapStartFunctionName:
    Value: !Ref SnapStartFunction
  SampleApiUrl:
    Description: Load-test target for the on-demand sample
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  SnapStartApiUrl:
    Description: Load-test target for the SnapStart sample (invokes the live alias)
    Value: !Sub "https://${SnapStartApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
